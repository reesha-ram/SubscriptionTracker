{% extends 'base.html' %}

{% block title %}Manage Subscriptions{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>All Subscriptions</h2>
    <a href="/subscriptions/add-page" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Add New</a>
</div>

<div class="card border-0 shadow-sm mb-3">
    <div class="card-body py-2">
        <div class="row align-items-center">
            <div class="col-md-4">
                <select id="filter-category" class="form-select" onchange="loadSubscriptionsList()">
                    <option value="">All Categories</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Infrastructure">Infrastructure</option>
                    <option value="Fitness">Fitness</option>
                    <option value="Software">Software</option>
                    <option value="Utilities">Utilities</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="col-md-4">
                <select id="filter-status" class="form-select" onchange="loadSubscriptionsList()">
                    <option value="">All Statuses</option>
                    <option value="Active">Active</option>
                    <option value="Cancelled">Cancelled</option>
                    <option value="Trial">Trial</option>
                </select>
            </div>
        </div>
    </div>
</div>

<div class="card border-0 shadow-sm">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Service</th>
                        <th>Price</th>
                        <th>Cycle</th>
                        <th>Category</th>
                        <th>Next Billing</th>
                        <th>Status</th>
                        <th>Urgency</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody id="subscriptions-table-body">
                    <tr><td colspan="8" class="text-center py-3">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/subscriptions.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", loadSubscriptionsList);
</script>
{% endblock %}
