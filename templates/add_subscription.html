{% extends 'base.html' %}

{% block title %}Add Subscription{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <h3 class="mb-4">Add Subscription</h3>

                <div id="alert-box" class="alert alert-danger d-none"></div>

                <form id="add-subscription-form">
                    <div class="mb-3">
                        <label class="form-label">Service Name</label>
                        <input type="text" id="service_name" class="form-control" placeholder="e.g., Netflix, AWS" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Price</label>
                        <input type="number" step="0.01" id="price" class="form-control" placeholder="499.00" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Billing Cycle</label>
                        <select id="billing_cycle" class="form-select">
                            <option value="Monthly">Monthly</option>
                            <option value="Yearly">Yearly</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Next Billing Date</label>
                        <input type="date" id="next_billing_date" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Category</label>
                        <select id="category" class="form-select">
                            <option value="Entertainment">Entertainment</option>
                            <option value="Infrastructure">Infrastructure</option>
                            <option value="Fitness">Fitness</option>
                            <option value="Software">Software</option>
                            <option value="Utilities">Utilities</option>
                            <option value="Other" selected>Other</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Status</label>
                        <select id="status" class="form-select">
                            <option value="Active" selected>Active</option>
                            <option value="Cancelled">Cancelled</option>
                            <option value="Trial">Trial</option>
                        </select>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" id="auto_renew" class="form-check-input" checked>
                        <label class="form-check-label" for="auto_renew">Auto Renew</label>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Save Subscription</button>
                        <a href="/subscriptions/manage-page" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/subscriptions.js"></script>
{% endblock %}
